name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "fr_FR/**"
      - "index.md"
      - "index.html"
      - "_config.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a index.html _site/index.html
          cp -a fr_FR _site/fr_FR
          test -f _site/fr_FR/index.html
          test -f _site/fr_FR/changelog/index.html
          grep -q 'v1.0.44' _site/fr_FR/index.html
          grep -q 'v1.0.44' _site/fr_FR/changelog/index.html
          if grep -R -i -E 'MQTT|Apache|PROD|DEV valid|DEV validée|DEV validee|non touch|redémarr|redemarr' _site; then
            echo "Internal words found in public documentation"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
